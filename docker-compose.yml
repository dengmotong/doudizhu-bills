services:
  app:
    build: .
    container_name: doudizhu-bills
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xiaomimimo.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-mimo-v2.5}
    restart: unless-stopped
